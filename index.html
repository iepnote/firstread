<!DOCTYPE html>
<!-- 첫 읽기 연습책 홈 v1 — 4권 선택 화면. 책 본문은 books/book1~4.html (각 책 폴더 outputs/ 최신본 복사) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>첫 읽기 연습책</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:linear-gradient(160deg,#FFF8E7 0%,#FFEFD5 55%,#FFE4C4 100%);
    display:flex;flex-direction:column;align-items:center;
    min-height:100vh;padding:4vh 4vw 2vh;
  }
  h1{
    font-size:clamp(28px,5.2vmin,52px);color:#5D4037;letter-spacing:.02em;
    display:flex;align-items:center;gap:.4em;
  }
  .sub{margin-top:.8vh;font-size:clamp(14px,2.2vmin,22px);color:#8D6E63}
  .grid{
    flex:1;display:grid;grid-template-columns:repeat(2,minmax(240px,420px));
    gap:clamp(14px,3vmin,30px);align-content:center;justify-content:center;
    width:100%;max-width:960px;padding:3vh 0;
  }
  @media (max-width:560px){.grid{grid-template-columns:minmax(240px,1fr)}}
  a.card{
    display:flex;align-items:center;gap:clamp(12px,2.4vmin,24px);
    background:#fff;border-radius:26px;padding:clamp(18px,3.4vmin,34px);
    text-decoration:none;border:4px solid transparent;
    box-shadow:0 6px 18px rgba(93,64,55,.14);
    transition:transform .12s ease,box-shadow .12s ease;
  }
  a.card:hover,a.card:focus-visible{transform:translateY(-4px);box-shadow:0 12px 26px rgba(93,64,55,.2)}
  a.card:active{transform:scale(.97)}
  .c1{border-color:#FFD54F}.c2{border-color:#AED581}.c3{border-color:#81D4FA}.c4{border-color:#F8BBD0}
  .emoji{
    font-size:clamp(44px,8.5vmin,84px);line-height:1;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.12));
  }
  .txt{display:flex;flex-direction:column;gap:.5vh;min-width:0}
  .vol{font-size:clamp(13px,2vmin,19px);font-weight:700;letter-spacing:.06em;color:#fff;
    border-radius:999px;padding:.22em .9em;width:max-content}
  .c1 .vol{background:#F9A825}.c2 .vol{background:#7CB342}.c3 .vol{background:#039BE5}.c4 .vol{background:#EC407A}
  .name{font-size:clamp(20px,3.4vmin,34px);font-weight:800;color:#4E342E;word-break:keep-all}
  footer{font-size:clamp(12px,1.8vmin,16px);color:#A1887F;padding:1.2vh 0 .6vh;text-align:center}
</style>
</head>
<body>
  <h1>📖 첫 읽기 연습책</h1>
  <div class="sub">읽고 싶은 책을 눌러 주세요</div>
  <nav class="grid">
    <a class="card c1" href="books/book1.html">
      <span class="emoji">🐤</span>
      <span class="txt"><span class="vol">1권</span><span class="name">아기 새가 포르르</span></span>
    </a>
    <a class="card c2" href="books/book2.html">
      <span class="emoji">🐰</span>
      <span class="txt"><span class="vol">2권</span><span class="name">토끼가 우르르</span></span>
    </a>
    <a class="card c3" href="books/book3.html">
      <span class="emoji">🦢</span>
      <span class="txt"><span class="vol">3권</span><span class="name">루루라라 기러기네</span></span>
    </a>
    <a class="card c4" href="books/book4.html">
      <span class="emoji">🐘</span>
      <span class="txt"><span class="vol">4권</span><span class="name">코코 코끼리 두두 두더지</span></span>
    </a>
  </nav>
  <footer>첫 읽기 연습책 학습지 by 민예원선생님 📧 iepnote@gmail.com</footer>
</body>
</html>
