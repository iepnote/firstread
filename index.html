<title>첫 읽기 연습책</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-weight:700;color:#4A3F35;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 20%, #FFFDF8 0%, #FBEEDF 60%, #F6E4CF 100%);padding:20px}
.box{background:#fff;border:3px solid #FFE0B2;border-radius:24px;padding:40px 34px;max-width:440px;width:100%;
  text-align:center;box-shadow:0 10px 26px rgba(120,90,60,.14)}
.emoji{font-size:52px;margin-bottom:10px}
h1{font-size:22px;margin-bottom:14px;word-break:keep-all}
p{color:#8A7C6E;font-size:14px;line-height:1.7;margin-bottom:22px;word-break:keep-all}
input{width:100%;font-family:inherit;font-weight:700;font-size:17px;text-align:center;padding:12px;
  border:2px solid #F0E2D2;border-radius:12px;outline:none;margin-bottom:12px}
input:focus{border-color:#F9A825}
button{width:100%;font-family:inherit;font-weight:800;font-size:17px;padding:13px;border:none;border-radius:12px;
  background:#F9A825;color:#fff;cursor:pointer}
button:disabled{background:#e8cf9a;cursor:wait}
#msg{margin-top:12px;font-size:13px;font-weight:800;color:#C0392B;min-height:18px}
.foot{margin-top:18px;font-size:11.5px;color:#b8a898;line-height:1.6;word-break:keep-all}
</style>
</head>
<body>
<div class="box">
  <div class="emoji">🔒</div>
  <h1>첫 읽기 연습책</h1>
  <p>본 자료는 저작권 보호를 위해 비밀번호가 설정되어 있습니다.<br>수업용 비밀번호를 입력해 주세요.</p>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="off">
  <button id="go" type="button">열기</button>
  <div id="msg"></div>
  <div class="foot">저작권법 제25조 제2항에 따라 학교 수업 목적으로 제작된 자료입니다.<br>수업 공간 외 사용과 무단 배포를 삼가 주세요.</div>
</div>

function b2u(b){ var s=atob(b), u=new Uint8Array(s.length); for(var i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return u; }
async function unlock(pw){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b2u(SALT),iterations:310000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2u(IV)},key,b2u(DATA));
  try{ sessionStorage.setItem("frLockPw",pw); }catch(e){}
  var txt=new TextDecoder("utf-8").decode(pt);
  setTimeout(function(){ document.open(); document.write(txt); document.close(); },30);
}
var btn=document.getElementById("go"), inp=document.getElementById("pw"), msg=document.getElementById("msg");
function tryGo(){
  var pw=inp.value; if(!pw) return;
  btn.disabled=true; btn.textContent="여는 중…"; msg.textContent="";
  unlock(pw).catch(function(){ btn.disabled=false; btn.textContent="열기"; msg.textContent="비밀번호가 맞지 않아요. 다시 입력해 주세요."; inp.select(); });
}
btn.onclick=tryGo;
inp.addEventListener("keydown",function(e){ if(e.key==="Enter") tryGo(); });
try{
  var saved=sessionStorage.getItem("frLockPw");
  if(saved){ btn.disabled=true; btn.textContent="여는 중…"; unlock(saved).catch(function(){ try{sessionStorage.removeItem("frLockPw");}catch(e){} btn.disabled=false; btn.textContent="열기"; inp.focus(); }); }
  else inp.focus();
}catch(e){}
</script>
